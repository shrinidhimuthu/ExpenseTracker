<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense & Daily Budget Tracker (₹)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

<div class="max-w-5xl mx-auto py-10 px-4">
    <!-- Header -->
    <header class="bg-indigo-600 text-white rounded-xl p-6 shadow-md mb-8 flex flex-wrap justify-between items-center gap-4">
        <div>
            <h1 class="text-2xl font-bold">Personal Expense & Daily Budget Tracker</h1>
            <p class="text-indigo-200 text-sm mt-1">Enterprise Java Spring Boot Web Application (₹)</p>
        </div>
        <!-- Budget Configurator -->
        <div class="bg-indigo-700 p-3 rounded-lg flex items-center gap-3">
            <label class="text-xs font-semibold uppercase tracking-wider">Monthly Budget:</label>
            <input type="number" id="monthlyBudgetInput" value="10000" onchange="updateBudget()" class="w-28 px-2 py-1 text-gray-900 rounded text-sm font-bold focus:outline-none">
        </div>
    </header>

    <!-- Summary Report Cards -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
            <p class="text-xs text-gray-500 uppercase font-semibold">Total Spent</p>
            <p class="text-xl font-bold text-gray-900 mt-1" id="totalSpent">₹0.00</p>
        </div>
        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
            <p class="text-xs text-gray-500 uppercase font-semibold">Budget Remaining</p>
            <p class="text-xl font-bold text-indigo-600 mt-1" id="budgetRemaining">₹0.00</p>
        </div>
        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
            <p class="text-xs text-gray-500 uppercase font-semibold">Days Left in Month</p>
            <p class="text-xl font-bold text-blue-600 mt-1" id="daysLeft">0</p>
        </div>
        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
            <p class="text-xs text-gray-500 uppercase font-semibold">Safe Daily Allowance</p>
            <p class="text-xl font-bold text-emerald-600 mt-1" id="dailyAllowance">₹0.00</p>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <!-- Add Expense Form -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 md:col-span-1">
            <h2 class="text-lg font-semibold mb-4 text-gray-800">Add New Expense</h2>
            <form id="expenseForm" onsubmit="addExpense(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Title / Description</label>
                    <input type="text" id="title" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="e.g., Groceries">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Amount (₹)</label>
                    <input type="number" step="0.01" id="amount" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="0.00">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Category</label>
                    <select id="category" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="Food & Groceries">Food & Groceries</option>
                        <option value="Utilities & Bills">Utilities & Bills</option>
                        <option value="Transport">Transport</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Others">Others</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Date</label>
                    <input type="date" id="date" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition">Add Expense</button>
            </form>
        </div>

        <!-- Expense List Table -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 md:col-span-2">
            <h2 class="text-lg font-semibold mb-4 text-gray-800">Transaction History & Summary Report</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                    <tr class="border-b text-xs text-gray-500 uppercase">
                        <th class="py-2 px-3">Date</th>
                        <th class="py-2 px-3">Title</th>
                        <th class="py-2 px-3">Category</th>
                        <th class="py-2 px-3 text-right">Amount</th>
                        <th class="py-2 px-3 text-center">Action</th>
                    </tr>
                    </thead>
                    <tbody id="expenseTableBody" class="text-sm divide-y">
                    <!-- Populated dynamically via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('date').valueAsDate = new Date();

    let monthlyBudget = localStorage.getItem('monthlyBudget') ? parseFloat(localStorage.getItem('monthlyBudget')) : 10000.00;
    document.getElementById('monthlyBudgetInput').value = monthlyBudget;

    function updateBudget() {
        monthlyBudget = parseFloat(document.getElementById('monthlyBudgetInput').value) || 0;
        localStorage.setItem('monthlyBudget', monthlyBudget);
        fetchExpenses();
    }

    function calculateDaysLeft() {
        const now = new Date();
        const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0);
        const daysLeft = lastDay.getDate() - now.getDate() + 1;
        return daysLeft > 0 ? daysLeft : 1;
    }

    async function fetchExpenses() {
        try {
            const response = await fetch('/api/expenses');
            const expenses = await response.json();
            const tbody = document.getElementById('expenseTableBody');
            tbody.innerHTML = '';

            let total = 0;
            expenses.forEach(exp => {
                total += exp.amount;
                const row = document.createElement('tr');
                row.innerHTML = `
                        <td class="py-3 px-3 text-gray-500">${exp.date}</td>
                        <td class="py-3 px-3 font-medium text-gray-800">${exp.title}</td>
                        <td class="py-3 px-3"><span class="bg-gray-100 text-gray-700 px-2.5 py-1 rounded-full text-xs">${exp.category}</span></td>
                        <td class="py-3 px-3 text-right font-semibold text-gray-900">₹${exp.amount.toFixed(2)}</td>
                        <td class="py-3 px-3 text-center">
                            <button onclick="deleteExpense(${exp.id})" class="text-red-500 hover:text-red-700 text-xs font-semibold">Delete</button>
                        </td>
                    `;
                tbody.appendChild(row);
            });

            // Summary Calculations
            const remaining = monthlyBudget - total;
            const daysLeft = calculateDaysLeft();
            const dailyLimit = remaining > 0 ? (remaining / daysLeft) : 0;

            document.getElementById('totalSpent').innerText = `₹${total.toFixed(2)}`;
            document.getElementById('budgetRemaining').innerText = `₹${remaining.toFixed(2)}`;
            document.getElementById('daysLeft').innerText = daysLeft;
            document.getElementById('dailyAllowance').innerText = `₹${dailyLimit.toFixed(2)}`;

        } catch (err) {
            console.error('Error fetching expenses:', err);
        }
    }

    async function addExpense(event) {
        event.preventDefault();
        const expense = {
            title: document.getElementById('title').value,
            amount: parseFloat(document.getElementById('amount').value),
            category: document.getElementById('category').value,
            date: document.getElementById('date').value
        };

        await fetch('/api/expenses', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(expense)
        });

        document.getElementById('expenseForm').reset();
        document.getElementById('date').valueAsDate = new Date();
        fetchExpenses();
    }

    async function deleteExpense(id) {
        await fetch(`/api/expenses/${id}`, { method: 'DELETE' });
        fetchExpenses();
    }

    fetchExpenses();
</script>
</body>
</html>
