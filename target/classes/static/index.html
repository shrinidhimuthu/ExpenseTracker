<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense & Daily Budget Tracker (₹)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

<div class="max-w-4xl mx-auto py-10 px-4">
    <!-- Header -->
    <header class="bg-indigo-600 text-white rounded-xl p-6 shadow-md mb-8 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold">Personal Expense & Daily Budget Tracker</h1>
            <p class="text-indigo-200 text-sm mt-1">Enterprise Java Spring Boot Web Application (₹)</p>
        </div>
        <div class="text-right">
            <span class="text-xs bg-indigo-500 px-3 py-1 rounded-full uppercase tracking-wider font-semibold">Active Budget</span>
            <p class="text-xl font-bold mt-1" id="totalSpent">₹0.00</p>
        </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <!-- Add Expense Form -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 md:col-span-1">
            <h2 class="text-lg font-semibold mb-4 text-gray-800">Add New Expense</h2>
            <form id="expenseForm" onsubmit="addExpense(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Title / Description</label>
                    <input type="text" id="title" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="e.g., Groceries">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Amount (₹)</label>
                    <input type="number" step="0.01" id="amount" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="0.00">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Category</label>
                    <select id="category" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="Food & Groceries">Food & Groceries</option>
                        <option value="Utilities & Bills">Utilities & Bills</option>
                        <option value="Transport">Transport</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Others">Others</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Date</label>
                    <input type="date" id="date" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition">Add Expense</button>
            </form>
        </div>

        <!-- Expense List Table -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 md:col-span-2">
            <h2 class="text-lg font-semibold mb-4 text-gray-800">Transaction History</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                    <tr class="border-b text-xs text-gray-500 uppercase">
                        <th class="py-2 px-3">Date</th>
                        <th class="py-2 px-3">Title</th>
                        <th class="py-2 px-3">Category</th>
                        <th class="py-2 px-3 text-right">Amount</th>
                        <th class="py-2 px-3 text-center">Action</th>
                    </tr>
                    </thead>
                    <tbody id="expenseTableBody" class="text-sm divide-y">
                    <!-- Populated dynamically via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // Set today's date by default
    document.getElementById('date').valueAsDate = new Date();

    async function fetchExpenses() {
        try {
            const response = await fetch('/api/expenses');
            const expenses = await response.json();
            const tbody = document.getElementById('expenseTableBody');
            tbody.innerHTML = '';

            let total = 0;
            expenses.forEach(exp => {
                total += exp.amount;
                const row = document.createElement('tr');
                row.innerHTML = `
                        <py-2 class="py-3 px-3 text-gray-500">${exp.date}</td=>
                        <td class="py-3 px-3 font-medium text-gray-800">${exp.title}</td>
                        <td class="py-3 px-3"><span class="bg-gray-100 text-gray-700 px-2.5 py-1 rounded-full text-xs">${exp.category}</span></td>
                        <td class="py-3 px-3 text-right font-semibold text-gray-900">₹${exp.amount.toFixed(2)}</td>
                        <td class="py-3 px-3 text-center">
                            <button onclick="deleteExpense(${exp.id})" class="text-red-500 hover:text-red-700 text-xs font-semibold">Delete</button>
                        </td>
                    `;
                tbody.appendChild(row);
            });
            document.getElementById('totalSpent').innerText = `₹${total.toFixed(2)}`;
        } catch (err) {
            console.error('Error fetching expenses:', err);
        }
    }

    async function addExpense(event) {
        event.preventDefault();
        const expense = {
            title: document.getElementById('title').value,
            amount: parseFloat(document.getElementById('amount').value),
            category: document.getElementById('category').value,
            date: document.getElementById('date').value
        };

        await fetch('/api/expenses', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(expense)
        });

        document.getElementById('expenseForm').reset();
        document.getElementById('date').valueAsDate = new Date();
        fetchExpenses();
    }

    async function deleteExpense(id) {
        await fetch(`/api/expenses/${id}`, { method: 'DELETE' });
        fetchExpenses();
    }

    // Load data on page load
    fetchExpenses();
</script>
</body>
</html>
